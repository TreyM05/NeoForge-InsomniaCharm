# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml"

# A version range to match for said mod loader
loaderVersion="${loader_version_range}"

# The license for the mode.
license="${mod_license}"

# A list of mods
[[mods]]

# The modid of the mod
modId="insomniacharm"

# The version number of the mod
version="21.10"

# A display name for the mod
displayName="Insomnia Charm"

# A text field displayed in the mod UI
authors="Treyvon"

# The description text for the mod (multi line!)
description='''Adds an item that stops phantoms from spawning'''

# The coremods config file path is not configurable and is always loaded from META-INF/coremods.json

# A dependency
[[dependencies.insomniacharm]]
    # the modid of the dependency
    modId="neoforge"
    # The type of the dependency.
    type="required"

    # The version range of the dependency
    versionRange="${neo_version_range}"

    # An ordering relationship for the dependency.
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT, or SERVER
    side="BOTH"

# Here's another dependency
[[dependencies.insomniacharm]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.insomniacharm]]
modId = "curios"
type="required"
versionRange = "[3.2,)"
ordering="NONE"
side="BOTH"